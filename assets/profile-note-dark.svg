<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="198" viewBox="0 0 1000 198" role="img" aria-labelledby="title desc">
  <title id="title">Ahmet Göker, CSINT Research field note</title>
  <desc id="desc">A dark field-note header with the name Ahmet Göker in light serif type and the focus areas OSINT, threat intelligence and AI workflow security.</desc>

  <style>
    .paper { fill: #111815; }
    .frame { fill: none; stroke: #56635e; stroke-width: 1.5; }
    .rule { stroke: #3d4944; stroke-width: 1; }
    .accent-rule { stroke: #d46c59; stroke-width: 5; }
    .eyebrow { fill: #e17b68; font: 700 16px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 3px; }
    .name { fill: #eee8dc; font: 600 56px Georgia, "Times New Roman", serif; }
    .focus { fill: #c8d2cd; font: 400 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  </style>

  <rect class="paper" x="1" y="1" width="998" height="196"/>
  <rect class="frame" x="13" y="13" width="974" height="172"/>
  <line class="accent-rule" x1="14" y1="13" x2="14" y2="185"/>
  <line class="rule" x1="60" y1="64" x2="940" y2="64"/>

  <text class="eyebrow" x="60" y="47">CSINT RESEARCH / FIELD NOTE</text>
  <text class="name" x="60" y="128">Ahmet Göker</text>
  <text class="focus" x="62" y="164">OSINT · threat intelligence · AI workflow security</text>
</svg>
