<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
  <title id="title">Ahmet Goker profile note</title>
  <desc id="desc">A restrained CSINT Research field-note header for Ahmet Goker, focused on OSINT, threat intelligence, and AI workflow security.</desc>

  <style>
    .paper { fill: #f5f0e4; }
    .frame { fill: none; stroke: #aaa294; stroke-width: 1.5; }
    .rule { stroke: #c7c0b3; stroke-width: 1; }
    .accent-rule { stroke: #b34b3c; stroke-width: 5; }
    .eyebrow { fill: #a24033; font: 700 15px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 3px; }
    .name { fill: #183a30; font: 600 54px Georgia, "Times New Roman", serif; }
    .focus { fill: #304c43; font: 400 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .method-label { fill: #6d756f; font: 700 12px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 2px; }
    .method { fill: #304c43; font: 500 16px ui-monospace, SFMono-Regular, Consolas, monospace; }

    @media (prefers-color-scheme: dark) {
      .paper { fill: #111815; }
      .frame { stroke: #56635e; }
      .rule { stroke: #3d4944; }
      .accent-rule { stroke: #d46c59; }
      .eyebrow { fill: #e17b68; }
      .name { fill: #eee8dc; }
      .focus, .method { fill: #c8d2cd; }
      .method-label { fill: #89958f; }
    }
  </style>

  <rect class="paper" x="1" y="1" width="998" height="258"/>
  <rect class="frame" x="13" y="13" width="974" height="234"/>
  <line class="accent-rule" x1="14" y1="13" x2="14" y2="247"/>
  <line class="rule" x1="60" y1="65" x2="940" y2="65"/>
  <line class="rule" x1="60" y1="201" x2="940" y2="201"/>

  <text class="eyebrow" x="60" y="48">CSINT RESEARCH / FIELD NOTE</text>
  <text class="name" x="60" y="139">Ahmet Göker</text>
  <text class="focus" x="62" y="176">OSINT · threat intelligence · AI workflow security</text>

  <text class="method-label" x="60" y="228">METHOD</text>
  <text class="method" x="160" y="228">source → check → evidence → report</text>
</svg>
